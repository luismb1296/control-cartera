<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Cartera</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0B2A33">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>try{var t=localStorage.getItem('cc-tema');if(t==='claro')document.documentElement.dataset.theme='light';if(t==='oscuro')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
  <div id="app"><div class="loading">Cargando…</div></div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
